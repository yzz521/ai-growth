name: V0.2 verification

on:
  push:
    branches:
      - feat/v0.2-workspace-rework
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q app desktop_helper tests

      - name: Run tests
        run: pytest -q

      - name: Check V0.2 frontend syntax
        run: node --check app/static-v2/app.js
